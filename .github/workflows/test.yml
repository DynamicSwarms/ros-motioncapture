name: Build and test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: ros:lyrical-ros-base-resolute
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-rosdep
          rosdep update
          rosdep install --from-paths ros_motioncapture --ignore-src --rosdistro lyrical -y

      - name: Build
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --packages-select ros_motioncapture --cmake-args -DLIBMOTIONCAPTURE_ENABLE_VRPN=ON

      - name: Test
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon test --packages-select ros_motioncapture --event-handlers console_direct+ --ctest-args -V
          colcon test-result --verbose
